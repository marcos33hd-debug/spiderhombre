<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra cita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="sky"></canvas>

<div class="grain"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow reveal">Una invitación</p>
    <h1 class="hero-title reveal">Nuestra cita <span class="heart">❤</span></h1>
    <div class="hero-date reveal">
      <span class="line"></span>
      <p id="date-label" class="date-text">28 de agosto</p>
      <span class="line"></span>
    </div>
  </div>
  <div class="scroll-cue reveal">
    <span>desliza</span>
    <div class="scroll-cue-track"><div class="scroll-cue-dot"></div></div>
  </div>
</section>

<!-- TIMELINE -->
<section class="timeline-section">
  <p class="section-eyebrow reveal">El plan</p>

  <div class="timeline">
    <div class="timeline-line"></div>

    <div class="stop reveal" data-side="left">
      <div class="stop-node">🚌</div>
      <div class="stop-card glass">
        <span class="stop-time">18:00</span>
        <span class="stop-place">Voy en autobús a tu casa</span>
      </div>
    </div>

    <div class="stop reveal" data-side="right">
      <div class="stop-node">🌊</div>
      <div class="stop-card glass">
        <span class="stop-time">18:20</span>
        <span class="stop-place">Paseo por el sitio donde ibas de pequeña</span>
      </div>
    </div>

    <div class="stop reveal" data-side="left">
      <div class="stop-node">🍿</div>
      <div class="stop-card glass">
        <span class="stop-time">19:20</span>
        <span class="stop-place">Kinépolis Plaza Mar 2</span>
      </div>
    </div>

    <div class="stop reveal" data-side="right">
      <div class="stop-node">🕷️</div>
      <div class="stop-card glass">
        <span class="stop-time">19:45</span>
        <span class="stop-place">Spider-Man: Brand New Day</span>
      </div>
    </div>

    <div class="stop reveal" data-side="left">
      <div class="stop-node">🍔</div>
      <div class="stop-card glass">
        <span class="stop-time">22:45</span>
        <span class="stop-place">Cena en Goiko</span>
      </div>
    </div>

    <div class="stop reveal" data-side="right">
      <div class="stop-node">🌃</div>
      <div class="stop-card glass">
        <span class="stop-time">00:15</span>
        <span class="stop-place">Mirador de Montepinar</span>
      </div>
    </div>

    <div class="stop reveal" data-side="left">
      <div class="stop-node">🚗</div>
      <div class="stop-card glass">
        <span class="stop-time">01:30</span>
        <span class="stop-place">Vuelta en coche</span>
      </div>
    </div>

  </div>
</section>

<!-- CTA -->
<section class="cta-section">
  <p class="section-eyebrow reveal">Y bien</p>
  <button id="cta-btn" class="cta-btn reveal">
    <span>¿Te apetece?</span> <span class="heart">❤</span>
  </button>
</section>

<!-- OVERLAY DE RESPUESTA -->
<div id="answer-overlay" class="answer-overlay">
  <div class="answer-heart">❤</div>
</div>

<!-- MÚSICA -->
<button id="music-toggle" class="music-toggle" aria-label="Reproducir música">
  <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
  <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
</button>
<audio id="bg-audio" loop preload="none">
  <source src="assets/song.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
